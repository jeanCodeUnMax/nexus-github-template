name: "📋 Kanban Automation — On Project Move"

on:
  projects_v2_item:
    types: [edited]

jobs:
  kanban-sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Get project item details
        id: item
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NEXUS_PAT }}
          script: |
            const itemId = context.payload.projects_v2_item.node_id;
            const query = `
              query($nodeId: ID!) {
                node(id: $nodeId) {
                  ... on ProjectV2Item {
                    content {
                      ... on Issue {
                        number
                        title
                        labels(first: 10) { nodes { name } }
                      }
                    }
                    fieldValues(first: 10) {
                      nodes {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          field { ... on ProjectV2SingleSelectField { name } }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const result = await github.graphql(query, { nodeId: itemId });
            const item = result.node;
            const statusField = item.fieldValues.nodes.find(
              f => f.field?.name === 'Status'
            );
            const status = statusField?.name || 'Unknown';
            const issue = item.content;
            
            core.setOutput('status', status);
            core.setOutput('issue_number', issue?.number || '');
            core.setOutput('issue_title', issue?.title || '');
            return { status, issue };

      # ─── Quand carte → "In Progress" ────────────────────────────────────
      - name: Handle "In Progress"
        if: steps.item.outputs.status == 'In Progress'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.item.outputs.issue_number }}');
            if (!issueNumber) return;
            
            // Ajouter label "in-progress"
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['status:in-progress']
            });

            // Commenter
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `▶️ **Démarré** — Cette issue a été déplacée vers **In Progress** dans le Kanban.`
            });

      # ─── Quand carte → "Review" ──────────────────────────────────────────
      - name: Handle "Review"
        if: steps.item.outputs.status == 'Review'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.item.outputs.issue_number }}');
            if (!issueNumber) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['status:review']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `🔍 **En review** — Cette issue attend une validation. Assurez-vous qu'une PR est liée.`
            });

      # ─── Quand carte → "Done" ────────────────────────────────────────────
      - name: Handle "Done"
        if: steps.item.outputs.status == 'Done'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.item.outputs.issue_number }}');
            if (!issueNumber) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['status:done']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ **Done** — Issue marquée comme terminée depuis le Kanban.`
            });
