name: "🤖 Agent On-Demand — /run-agent Command"

on:
  issue_comment:
    types: [created]

jobs:
  run-agent-command:
    # Sécurité : seulement les collaborateurs peuvent déclencher
    if: |
      contains(github.event.comment.body, '/run-agent') &&
      github.event.comment.author_association != 'NONE'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Parse command
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body;
            
            // Syntaxe: /run-agent <type> [param=value ...]
            // Exemples:
            //   /run-agent colab
            //   /run-agent docker image=python:3.11
            //   /run-agent plan scope=full
            const match = comment.match(/\/run-agent\s+(\w+)(.*)?/);
            
            if (!match) {
              core.setFailed('Commande non reconnue. Syntaxe: /run-agent <type> [options]');
              return;
            }
            
            const agentType = match[1].trim();
            const rawParams = (match[2] || '').trim();
            
            // Parser les params key=value
            const params = {};
            const paramMatches = rawParams.matchAll(/(\w+)=(\S+)/g);
            for (const p of paramMatches) {
              params[p[1]] = p[2];
            }
            
            console.log('Agent type:', agentType);
            console.log('Params:', params);
            
            core.setOutput('agent_type', agentType);
            core.setOutput('params', JSON.stringify(params));
            core.setOutput('issue_number', context.payload.issue.number);
            core.setOutput('issue_title', context.payload.issue.title);

      - name: React to comment (acknowledge)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      # ─── Dispatch Colab ──────────────────────────────────────────────────
      - name: Run — Colab
        if: steps.parse.outputs.agent_type == 'colab'
        run: |
          echo "🚀 Lancement Colab pour issue #${{ steps.parse.outputs.issue_number }}"
          curl -s -X POST "${{ secrets.COLAB_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "issue_number": "${{ steps.parse.outputs.issue_number }}",
              "issue_title": "${{ steps.parse.outputs.issue_title }}",
              "params": ${{ steps.parse.outputs.params }},
              "triggered_by": "${{ github.event.comment.user.login }}"
            }'

      # ─── Dispatch Docker ─────────────────────────────────────────────────
      - name: Run — Docker
        if: steps.parse.outputs.agent_type == 'docker'
        run: |
          echo "🐳 Lancement Docker pour issue #${{ steps.parse.outputs.issue_number }}"
          curl -s -X POST "${{ secrets.DOCKER_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.DOCKER_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "issue_number": "${{ steps.parse.outputs.issue_number }}",
              "params": ${{ steps.parse.outputs.params }},
              "triggered_by": "${{ github.event.comment.user.login }}"
            }'

      # ─── Dispatch Plan ───────────────────────────────────────────────────
      - name: Run — AI Plan
        if: steps.parse.outputs.agent_type == 'plan'
        run: |
          echo "🧠 Lancement AI Planner pour issue #${{ steps.parse.outputs.issue_number }}"
          curl -s -X POST "${{ secrets.AI_PLANNER_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.AI_PLANNER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "issue_number": "${{ steps.parse.outputs.issue_number }}",
              "issue_body": ${{ toJson(github.event.issue.body) }},
              "params": ${{ steps.parse.outputs.params }}
            }'

      # ─── Confirmation sur l'issue ─────────────────────────────────────────
      - name: Confirm dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const agentType = '${{ steps.parse.outputs.agent_type }}';
            const params = JSON.parse('${{ steps.parse.outputs.params }}' || '{}');
            const paramStr = Object.keys(params).length > 0 
              ? '\n**Params:** `' + JSON.stringify(params) + '`'
              : '';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.parse.outputs.issue_number }},
              body: `🤖 **Agent \`${agentType}\` lancé** par @${{ github.event.comment.user.login }}${paramStr}\n\n> Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });

      - name: Handle unknown agent type
        if: |
          steps.parse.outputs.agent_type != 'colab' &&
          steps.parse.outputs.agent_type != 'docker' &&
          steps.parse.outputs.agent_type != 'plan'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.parse.outputs.issue_number }},
              body: `❌ **Agent inconnu : \`${{ steps.parse.outputs.agent_type }}\`**\n\nAgents disponibles : \`colab\`, \`docker\`, \`plan\`\n\nSyntaxe : \`/run-agent <type> [key=value]\``
            });
