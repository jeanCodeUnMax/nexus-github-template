name: Issue Status Label Audit

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read

jobs:
  audit-status-label:
    if: startsWith(github.event.label.name, 'status:')
    runs-on: ubuntu-latest
    steps:
      - name: Record status transition
        run: |
          echo "Issue #${{ github.event.issue.number }}"
          echo "Status label: ${{ github.event.label.name }}"
          echo "ProjectV2 synchronization is intentionally optional in the base template."
