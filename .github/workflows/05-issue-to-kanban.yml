name: "🔁 Issue Label → Kanban Sync"

on:
  issues:
    types: [labeled]

jobs:
  sync-to-kanban:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Fail fast if NEXUS_PAT missing
        if: ${{ secrets.NEXUS_PAT == '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Kanban sync skipped - missing NEXUS_PAT`,
              body: `The workflow attempted to sync issue labels to ProjectV2 but the repository secret NEXUS_PAT is not configured. Please add a token with scopes: repo + read:project as the secret NEXUS_PAT.`
            });
            core.setFailed('NEXUS_PAT not configured');

      - name: Sync label to ProjectV2 Status
        if: ${{ secrets.NEXUS_PAT != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NEXUS_PAT }}
          script: |
            const labelName = context.payload.label?.name || '';
            if (!labelName || !labelName.startsWith('status:')) return;
            const statusValue = labelName.split(':').slice(1).join(':').trim();
            const issueNumber = context.payload.issue.number;

            // Query project items linked to the issue and find Status field
            const query = `query($owner:String!, $repo:String!, $number:Int!){ repository(owner:$owner, name:$repo){ issue(number:$number){ projectItems(first:50){ nodes{ id project{ id fields(first:50){ nodes{ ... on ProjectV2SingleSelectField { id name options(first:50){ id name } } } } } } } } }`;

            const res = await github.graphql(query, { owner: context.repo.owner, repo: context.repo.repo, number: issueNumber });
            const nodes = res.repository.issue.projectItems?.nodes || [];

            for (const item of nodes) {
              const fields = item.project.fields.nodes || [];
              const statusField = fields.find(f => f.name === 'Status');
              if (!statusField) continue;

              const option = statusField.options.nodes.find(o => o.name.toLowerCase() === statusValue.toLowerCase());
              if (!option) {
                console.warn(`Option for Status not found: ${statusValue}`);
                continue;
              }

              const mutation = `mutation($itemId:ID!,$fieldId:ID!,$optionId:ID!){ updateProjectV2ItemFieldValue(input:{projectId:\"${item.project.id}\", itemId:$itemId, fieldId:$fieldId, value:{singleSelectOptionId:$optionId}}){ projectV2Item { id } } }`;

              await github.graphql(mutation, { itemId: item.id, fieldId: statusField.id, optionId: option.id });
              console.log(`Updated project item ${item.id} -> ${option.name}`);
            }
