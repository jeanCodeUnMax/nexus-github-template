name: "🔎 Lint Workflows — YAML"

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
      - name: Run yamllint on workflows
        run: |
          yamllint -d '{extends: default, rules: {line-length: {max: 200}}}' .github/workflows || true
      - name: Fail if yamllint found issues
        run: |
          yamllint -f parsable .github/workflows || exit 1
