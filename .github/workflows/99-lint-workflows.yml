name: "🔎 Lint Workflows — YAML"

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
      - name: Validate workflow YAML
        run: |
          yamllint \
            -d '{extends: default, rules: {line-length: disable, trailing-spaces: disable, document-start: disable, truthy: disable}}' \
            .github/workflows
