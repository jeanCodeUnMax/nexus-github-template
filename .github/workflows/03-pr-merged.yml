name: PR Merged — Greffier Closure

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-transaction:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Mark linked issues merged
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const pattern = /(?:closes|fixes|resolves)\s+#(\d+)/gi;
            const issues = [...body.matchAll(pattern)].map(m => Number(m[1]));
            for (const issueNumber of issues) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['status:merged']
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `Greffier: PR #${context.payload.pull_request.number} merged; transaction Git clôturée.`
                });
              } catch (error) {
                core.warning(`Issue #${issueNumber}: ${error.message}`);
              }
            }
            core.info(`Linked issues processed: ${issues.join(', ') || 'none'}`);
