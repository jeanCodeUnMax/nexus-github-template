name: "✨ Feature"
description: "Fonctionnalité rattachée à une Epic"
title: "[FEATURE] "
labels: ["feature", "scope:development"]
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature — Fonctionnalité
        Une Feature appartient à une Epic. Elle se décompose en Tasks.

  - type: input
    id: parent_epic
    attributes:
      label: "Epic parente"
      placeholder: "#numéro_de_l_epic"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description"
      placeholder: "En tant que... je veux... afin de..."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "Tasks associées (à remplir)"
      placeholder: |
        - [ ] #issue_number — Task A
        - [ ] #issue_number — Task B

  - type: textarea
    id: acceptance
    attributes:
      label: "Critères d'acceptation"
      placeholder: |
        - [ ] Critère 1
        - [ ] Critère 2
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priorité"
      options:
        - "🔴 Critical"
        - "🟠 High"
        - "🟡 Medium"
        - "🟢 Low"
    validations:
      required: true

  - type: input
    id: agent_trigger
    attributes:
      label: "Label agent à déclencher (optionnel)"
      placeholder: "ex: agent:build, agent:test"
