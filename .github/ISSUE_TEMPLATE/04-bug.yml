name: "🐛 Bug"
description: "Anomalie à corriger"
title: "[BUG] "
labels: ["bug", "scope:fix"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

  - type: textarea
    id: reproduction
    attributes:
      label: "Étapes de reproduction"
      placeholder: |
        1. Faire...
        2. Cliquer sur...
        3. Observer...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Comportement attendu"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Comportement observé"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Contexte / Environnement"
      placeholder: "OS, version, navigateur, logs..."

  - type: dropdown
    id: severity
    attributes:
      label: "Sévérité"
      options:
        - "🔴 Bloquant"
        - "🟠 Majeur"
        - "🟡 Mineur"
        - "🟢 Cosmétique"
    validations:
      required: true

  - type: input
    id: related_feature
    attributes:
      label: "Feature/Task liée (optionnel)"
      placeholder: "#numéro"
